spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 1. CRITICAL: Update OAuth redirect URI to target the Nginx entry point
# On Render, this should evaluate to: https://tracker-frontend-3rvf.onrender.com/login/oauth2/code/google
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_REDIRECT_URI}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.api.base-url=${FRONTEND_URL}
app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# =======================================================
# Session Cookie Policies (Optimized for Same-Origin Proxy)
# =======================================================
server.servlet.session.cookie.name=SESSION

# Change from None to Lax because Nginx makes this a first-party setup
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=true

# Instructs Spring Boot to parse X-Forwarded-* headers built by Nginx
server.forward-headers-strategy=framework