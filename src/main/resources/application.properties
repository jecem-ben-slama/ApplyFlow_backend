# aplication.properties
spring.application.name=ApplyFlow
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Core Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

# ==========================================
# Spring Session JDBC Configuration

spring.session.store-type=jdbc

# Automatically provision the SPRING_SESSION tables on startup if they don't exist
spring.session.jdbc.initialize-schema=always

# Retain active logins for up to 30 days of inactivity
server.servlet.session.timeout=30d

# Automatically sweep expired sessions out of the database every night at 2:00 AM
spring.session.jdbc.cleanup-cron=0 0 2 * * *

# ==========================================
# ADDED: HikariCP Connection Pool Defense
# ==========================================
# Expand pool to prevent session verification steps from locking out application threads
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000

# Releases the database connection immediately after the transaction finishes
spring.jpa.open-in-view=false

# Session Cookie Policies
server.servlet.session.cookie.max-age=30d

# ==========================================
# App Encryption
# ==========================================
app.encryption.secret-key=${ENCRYPTION_SECRET_KEY}

# ==========================================
# OAuth2 / Google Registration
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/gmail.send,https://www.googleapis.com/auth/drive.readonly
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
