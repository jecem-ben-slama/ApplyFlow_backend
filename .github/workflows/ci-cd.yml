name: Backend CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tracker-api:latest
            ghcr.io/${{ github.repository_owner }}/tracker-api:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy with specific image
        run: |
          IMG_URL="ghcr.io/${{ github.repository_owner }}/tracker-api:${{ github.sha }}"
          ENCODED_IMG_URL=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$IMG_URL")
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&imgURL=$ENCODED_IMG_URL"

      - name: Wait for boot
        run: sleep 30

      - name: Health check
        run: |
          for i in {1..10}; do
            echo "Attempt $i: Checking health at ${{ secrets.RENDER_HEALTH_URL }}/actuator/health"
            if curl -sf "${{ secrets.RENDER_HEALTH_URL }}/actuator/health"; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 20 seconds..."
            sleep 20
          done
          echo "Backend failed health check after deploy"
          exit 1